server_tokens off;
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;   # ajusta: tras NAT hospitalario muchos usuarios comparten IP
limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;

server {                      # HTTP: healthcheck interno y redirección
  listen 8080;
  location = /nginx-health { access_log off; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 8443 ssl;
  http2 on;
  ssl_certificate     /run/secrets/tls_fullchain;
  ssl_certificate_key /run/secrets/tls_privkey;
  ssl_protocols TLSv1.2 TLSv1.3;        # TLS 1.3 exclusivo puede dejar fuera equipos hospitalarios antiguos
  ssl_session_tickets off;
  client_max_body_size 64k;
  include /etc/nginx/snippets/security_headers.conf;

  location = /api/v1/auth/login {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/snippets/proxy_params.conf;
    proxy_pass http://api:8000;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    include /etc/nginx/snippets/proxy_params.conf;
    proxy_pass http://api:8000;
  }
  location = /index.html {
    include /etc/nginx/snippets/security_headers.conf;     # repetido a propósito: add_header de abajo anula el nivel superior
    add_header Cache-Control "no-cache" always;
    root /usr/share/nginx/html;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
